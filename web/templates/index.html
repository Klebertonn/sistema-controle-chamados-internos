<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sistema de Chamados</title>
<link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h1>Sistema de Chamados</h1>

    <div class="card mt-4">

        <div class="card-header">
            Novo Chamado
        </div>

        <div class="card-body">

            <input
                class="form-control mb-2"
                id="titulo"
                placeholder="Título">

            <textarea
                class="form-control mb-2"
                id="descricao"
                placeholder="Descrição"></textarea>

            <select
                class="form-select mb-2"
                id="prioridade">

                <option>Baixa</option>
                <option>Média</option>
                <option>Alta</option>

            </select>

            <input
                class="form-control mb-2"
                id="solicitante"
                placeholder="Solicitante">

            <button
                class="btn btn-success"
                onclick="salvarChamado()">

                Criar Chamado

            </button>

        </div>

    </div>

    <div class="card mt-4">

        <div class="card-header">
            Chamados
        </div>

        <div class="card-body">

            <table class="table table-striped">

                <thead>

                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Status</th>
                    <th>Prioridade</th>
                    <th>Solicitante</th>
                </tr>

                </thead>

                <tbody id="tabelaChamados">

                </tbody>

            </table>

        </div>

    </div>

</div>

<script src="js/api.js"></script>

<script>
async function carregarChamados() {

    const chamados =
        await listarChamados();

    const tabela =
        document.getElementById("tabelaChamados");

    tabela.innerHTML = "";

    chamados.forEach(c => {

        tabela.innerHTML += `
        <tr>
            <td>${c.ordemId}</td>
            <td>${c.titulo}</td>
            <td>${c.status}</td>
            <td>${c.prioridade}</td>
            <td>${c.solicitante}</td>
        </tr>
        `;
    });
}

async function salvarChamado() {

    const chamado = {

        titulo:
            document.getElementById("titulo").value,

        descricao:
            document.getElementById("descricao").value,

        status: "Aberto",

        prioridade:
            document.getElementById("prioridade").value,

        solicitante:
            document.getElementById("solicitante").value,

        responsavelId: 0
    };

    const response =
        await criarChamado(chamado);

    if(response.ok){

        alert("Chamado criado com sucesso");

        carregarChamados();
    }
}

carregarChamados();
</script>

</body>
</html>
